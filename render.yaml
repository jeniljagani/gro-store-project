services:
  - type: web
    name: gro-store-backend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false   # Set this in Render dashboard → Environment tab
      - key: JWT_SECRET
        sync: false   # Set this in Render dashboard → Environment tab
      - key: GEMINI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false   # Set to your Vercel URL e.g. https://gro-store.vercel.app
